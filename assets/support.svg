<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" fill="none" role="img" aria-labelledby="t d">
  <title id="t">لنبنِ المزيد مما ينفع — صفحة الدعم والمساهمة</title>
  <desc id="d">شارك المشروع، اقترح تحسينًا، أو ساند تطوير المزيد من الأدوات العربية المفتوحة.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#0E2A2C"/><stop offset="1" stop-color="#15463A"/></linearGradient>
    <pattern id="stars" width="64" height="64" patternUnits="userSpaceOnUse"><path d="m32 12 6 14 14 6-14 6-6 14-6-14-14-6 14-6Z" stroke="#E7BD74" stroke-opacity=".10"/></pattern>
    <clipPath id="c"><rect width="1280" height="240" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1280" height="240" fill="url(#bg)"/>
    <rect width="380" height="240" fill="url(#stars)"/>
    <circle cx="1268" cy="12" r="150" stroke="#4AAE99" stroke-opacity=".12"/>
  </g>
  <rect x="1" y="1" width="1278" height="238" rx="23" stroke="#386457"/>
  <path d="M25 1h180" stroke="#E7BD74" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(64 82)">
    <rect width="316" height="76" rx="38" fill="#E7BD74"/>
    <text x="158" y="48" text-anchor="middle" fill="#123528" font-family="Tahoma, 'Segoe UI', 'Noto Naskh Arabic', Arial, sans-serif" font-size="21" font-weight="700" direction="rtl">صفحة الدعم والمساهمة</text>
  </g>
  <text x="64" y="200" fill="#8FB6AA" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.4">SHARE · SUGGEST · SUPPORT</text>

  <g font-family="Tahoma, 'Segoe UI', 'Noto Naskh Arabic', Arial, sans-serif" direction="rtl" text-anchor="start">
    <text x="1216" y="86" fill="#E7BD74" font-size="13" font-weight="700">مشروع مفتوح للجميع</text>
    <text x="1218" y="140" fill="#F5F1E5" font-size="36" font-weight="700">لنبنِ المزيد مما ينفع</text>
    <text x="1216" y="184" fill="#B0CCBC" font-size="18">شارك، اقترح تحسينًا، أو ساند التطوير — ويبقى أثمان مجانيًا</text>
  </g>
</svg>
